<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seguimiento de Firmas VGCI</title>
<style>
:root{
    --blanco:#FFFFFF;
    --dorado:#B5993A;
    --dorado-oscuro:#9E842D;
    --gris-institucional:#585857;
    --azul-institucional:#242732;

    --rojo-bolivia:#E30613;
    --amarillo-bolivia:#FFED00;
    --verde-bolivia:#008739;

    --fondo:#F4F4F3;
    --gris-claro:#E7E7E5;
    --gris-borde:#D4D4D1;
    --gris-medio:#8A8A87;

    --verde-ok:#008739;
    --rojo-error:#C62828;
    --amarillo-alerta:#F0C928;

    --sombra-suave:0 2px 8px rgba(36,39,50,.07);
    --sombra-media:0 5px 18px rgba(36,39,50,.10);
}

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--fondo);
    color:var(--azul-institucional);
    line-height:1.45;
}

/* =========================================================
   CONTROLES GENERALES
========================================================= */

input,
select,
textarea,
button{
    font:inherit;
}

button{
    border:0;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
    outline:3px solid rgba(181,153,58,.28);
    outline-offset:2px;
}

h1,
h2,
h3,
h4,
p{
    margin-top:0;
}

.h{
    display:none!important;
}

/* =========================================================
   ENCABEZADO
========================================================= */

header{
    position:relative;

    background:var(--azul-institucional);
    color:var(--blanco);

    padding:22px 30px 0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    min-height:88px;

    box-shadow:0 2px 8px rgba(36,39,50,.12);
}

/* Línea institucional dorada */
header::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:4px;

    background:
        linear-gradient(
            to right,
            var(--rojo-bolivia) 0%,
            var(--rojo-bolivia) 33.33%,
            var(--amarillo-bolivia) 33.33%,
            var(--amarillo-bolivia) 66.66%,
            var(--verde-bolivia) 66.66%,
            var(--verde-bolivia) 100%
        );
}

header b{
    position:relative;

    display:flex;
    align-items:center;

    min-height:48px;

    padding-left:18px;

    color:var(--blanco);

    font-size:23px;
    font-weight:600;
    line-height:1.2;
}

header b::before{
    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:4px;

    background:var(--dorado);

    border-radius:2px;
}

#quien{
    display:inline-flex;
    align-items:center;

    min-height:36px;

    padding:8px 15px;

    margin-bottom:4px;

    border-radius:20px;

    background:var(--gris-institucional);
    border:1px solid rgba(255,255,255,.15);

    color:var(--blanco);

    font-size:13px;
    font-weight:600;

    white-space:nowrap;
}

/* =========================================================
   CONTENEDOR PRINCIPAL
========================================================= */

main{
    width:min(1200px,94%);

    margin:28px auto 34px;

    padding:0;

    max-width:none;
}

/* =========================================================
   TARJETAS
========================================================= */

.p{
    background:var(--blanco);

    border:1px solid var(--gris-claro);

    border-radius:8px;

    padding:24px;

    margin-bottom:20px;

    box-shadow:var(--sombra-suave);
}

.p h3{
    margin:0 0 18px;

    color:var(--azul-institucional);

    font-size:20px;
    font-weight:600;
}

.p h4{
    color:var(--azul-institucional);

    font-size:16px;

    margin:20px 0 10px;
}

/* =========================================================
   LOGIN
========================================================= */

#vLogin{
    width:min(440px,100%);

    margin:55px auto 20px;
}

#vLogin h3{
    text-align:center;

    padding-bottom:15px;

    margin-bottom:20px;

    border-bottom:1px solid var(--gris-claro);
}

#vLogin h3::before{
    content:"VGCI";

    display:flex;

    width:64px;
    height:64px;

    margin:0 auto 15px;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--azul-institucional);

    border:3px solid var(--dorado);

    color:var(--dorado);

    font-size:20px;
    font-weight:bold;
}

/* =========================================================
   FORMULARIOS
========================================================= */

label{
    display:block;

    margin:10px 0 5px;

    color:var(--gris-institucional);

    font-size:13px;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;

    padding:11px 12px;

    border:1px solid var(--gris-borde);

    border-radius:5px;

    background:var(--blanco);

    color:var(--azul-institucional);

    outline:none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

input:hover,
select:hover,
textarea:hover{
    border-color:#A8A8A5;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--dorado);

    box-shadow:
        0 0 0 3px rgba(181,153,58,.15);
}

textarea{
    min-height:100px;

    resize:vertical;
}

/* =========================================================
   GRID
========================================================= */

.g{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:12px;
}

/* =========================================================
   BOTONES
========================================================= */

button{
    min-height:42px;

    padding:10px 18px;

    margin:4px 0 10px;

    border-radius:5px;

    background:var(--dorado);

    color:var(--blanco);

    cursor:pointer;

    font-size:14px;
    font-weight:bold;

    transition:
        background .2s ease,
        transform .1s ease,
        box-shadow .2s ease;
}

button:hover{
    background:var(--dorado-oscuro);

    box-shadow:
        0 2px 5px rgba(36,39,50,.12);
}

button:active{
    transform:translateY(1px);
}

button:disabled{
    background:#A5A5A2;

    cursor:not-allowed;
}

/* Botón secundario */
button.s{
    background:#E7E7E5;

    color:var(--azul-institucional);
}

button.s:hover{
    background:#D8D8D6;
}

/* =========================================================
   MENSAJES
========================================================= */

#msg{
    display:none;

    margin-bottom:15px;

    padding:12px 14px;

    border-radius:5px;

    font-size:14px;

    border-left:4px solid var(--dorado);

    background:#F3EBD2;

    color:#66551F;
}

#msg.ok{
    display:block;

    background:#E1F0E6;

    color:#185C2C;

    border-left-color:var(--verde-ok);
}

#msg.er{
    display:block;

    background:#F8D7DA;

    color:#842029;

    border-left-color:var(--rojo-error);
}

/* =========================================================
   RESULTADOS / DOCUMENTOS
========================================================= */

.c{
    position:relative;

    padding:16px;

    margin:10px 0;

    background:#FAFAF9;

    border:1px solid var(--gris-claro);

    border-radius:7px;

    cursor:pointer;

    color:var(--gris-institucional);

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .1s ease,
        box-shadow .2s ease;
}

.c:hover{
    background:#F5F1E4;

    border-color:#D8CC9D;

    box-shadow:
        0 3px 10px rgba(36,39,50,.08);

    transform:translateY(-1px);
}

.c b:first-child{
    color:var(--azul-institucional);

    font-size:15px;
}

.c br + *{
    color:var(--gris-institucional);
}

/* =========================================================
   SEMÁFORO
========================================================= */

b.sem{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:88px;

    min-height:30px;

    margin-left:8px;

    padding:5px 10px;

    border-radius:20px;

    font-size:11px!important;
    font-weight:bold;

    white-space:nowrap;
}

/* Verde */
b.sem.VERDE{
    background:var(--verde-ok);

    color:var(--blanco);
}

/* Amarillo */
b.sem.AMARILLO{
    background:var(--amarillo-alerta);

    color:var(--azul-institucional);
}

/* Rojo */
b.sem.ROJO{
    background:var(--rojo-error);

    color:var(--blanco);
}

/* =========================================================
   DETALLE
========================================================= */

#vDet{
    position:relative;
}

#vDet h3{
    margin-bottom:15px;

    padding-bottom:12px;

    border-bottom:1px solid var(--gris-claro);

    color:var(--azul-institucional);
}

#vDet p{
    padding:15px;

    background:#FAFAF9;

    border:1px solid var(--gris-claro);

    border-radius:6px;

    color:var(--gris-institucional);
}

#vDet a{
    display:inline-flex;

    align-items:center;

    min-height:34px;

    padding:7px 12px;

    margin-top:8px;

    border-radius:5px;

    background:var(--azul-institucional);

    color:var(--blanco);

    text-decoration:none;

    font-size:12px;
    font-weight:bold;
}

#vDet a:hover{
    background:#303441;
}

/* =========================================================
   HISTORIAL
========================================================= */

#vDet h4{
    padding-bottom:8px;

    border-bottom:1px solid var(--gris-claro);
}

#vDet h4 + div{
    border-top:0;
}

#vDet div:not(.g){
    color:var(--gris-institucional);
}

/* =========================================================
   CARGA DE PDF
========================================================= */

input[type="file"]{
    padding:9px;

    background:#FAFAF9;

    cursor:pointer;
}

input[type="file"]::file-selector-button{
    margin-right:10px;

    padding:8px 12px;

    border:0;

    border-radius:4px;

    background:var(--azul-institucional);

    color:var(--blanco);

    cursor:pointer;

    font-size:12px;
    font-weight:bold;
}

input[type="file"]::file-selector-button:hover{
    background:#303441;
}

/* =========================================================
   SECCIÓN USUARIOS
========================================================= */

#lu2{
    margin-bottom:20px;
}

#lu2 .c{
    cursor:default;

    display:flex;

    flex-wrap:wrap;

    align-items:center;

    gap:8px;
}

#lu2 .c:hover{
    transform:none;
}

#lu2 .c button{
    width:auto;

    min-height:34px;

    margin:3px 0 0;

    padding:7px 11px;

    font-size:12px;
}

#lu2 .c b{
    color:var(--azul-institucional);
}

/* =========================================================
   SELECTS
========================================================= */

select{
    cursor:pointer;
}

/* =========================================================
   CAMPOS DE BÚSQUEDA
========================================================= */

#bq{
    background:#fff;
}

#be{
    background:#fff;
}

/* =========================================================
   SECCIÓN DE BÚSQUEDA
========================================================= */

#vApp > .p:first-child h3{
    display:flex;
    align-items:center;
    gap:10px;
}

#vApp > .p:first-child h3::before{
    content:"";

    display:inline-block;

    width:4px;
    height:24px;

    background:var(--dorado);

    border-radius:2px;
}

/* =========================================================
   NUEVO REGISTRO
========================================================= */

#pAlta h3{
    display:flex;
    align-items:center;
    gap:10px;
}

#pAlta h3::before{
    content:"";

    display:inline-block;

    width:4px;
    height:24px;

    background:var(--dorado);

    border-radius:2px;
}

/* =========================================================
   USUARIOS
========================================================= */

#pUsu h3{
    display:flex;
    align-items:center;
    gap:10px;
}

#pUsu h3::before{
    content:"";

    display:inline-block;

    width:4px;
    height:24px;

    background:var(--dorado);

    border-radius:2px;
}

/* =========================================================
   CIERRE DE SESIÓN
========================================================= */

#vApp > button.s:last-child{
    display:block;

    width:auto;

    min-width:150px;

    margin:5px auto 25px;
}

/* =========================================================
   ESTADO DE CAMPOS
========================================================= */

input::placeholder,
textarea::placeholder{
    color:#999;

    opacity:1;
}

/* =========================================================
   SCROLL
========================================================= */

::-webkit-scrollbar{
    width:9px;
    height:9px;
}

::-webkit-scrollbar-track{
    background:#E7E7E5;
}

::-webkit-scrollbar-thumb{
    background:#A8A8A5;

    border-radius:8px;
}

::-webkit-scrollbar-thumb:hover{
    background:#858581;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .g{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    main{
        width:94%;
    }
}

@media(max-width:700px){

    header{
        padding:18px 18px 0;

        min-height:auto;

        flex-direction:column;

        align-items:flex-start;

        gap:16px;
    }

    header b{
        width:100%;

        font-size:20px;
    }

    #quien{
        width:100%;

        justify-content:center;

        margin-bottom:12px;
    }

    main{
        width:94%;

        margin-top:20px;
        margin-bottom:24px;
    }

    .p{
        padding:18px;

        margin-bottom:16px;
    }

    .p h3{
        font-size:18px;
    }

    .g{
        grid-template-columns:1fr;
    }

    button{
        width:100%;
    }

    #lu2 .c{
        display:block;
    }

    #lu2 .c button{
        display:inline-block;

        width:auto;

        margin-right:5px;
    }

    b.sem{
        margin-left:0;

        margin-top:8px;
    }

    #vDet .sem{
        display:inline-flex;
    }
}

@media(max-width:420px){

    header{
        padding-left:14px;
        padding-right:14px;
    }

    header b{
        font-size:18px;

        padding-left:14px;
    }

    header b::before{
        width:3px;
    }

    main{
        width:calc(100% - 20px);
    }

    .p{
        padding:15px;
    }

    button{
        font-size:14px;
    }

    #vLogin{
        margin-top:30px;
    }

    #vLogin h3::before{
        width:58px;
        height:58px;
    }
}

/* =========================================================
   ANIMACIONES SUAVES
========================================================= */

.p{
    animation:
        aparecer .22s ease-out;
}

@keyframes aparecer{

    from{
        opacity:0;
        transform:translateY(4px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   IMPRESIÓN
========================================================= */

@media print{

    body{
        background:#fff;
    }

    header,
    button,
    #msg{
        display:none!important;
    }

    main{
        width:100%;
        margin:0;
    }

    .p{
        border:0;

        box-shadow:none;

        page-break-inside:avoid;
    }
}
</style></head><body>
<header><b>Seguimiento de Firmas VGCI</b><span id="quien"></span></header>
<main>
<div id="msg"></div>

<div id="vLogin" class="p"><h3>Ingreso</h3>
<label>Usuario</label><input id="lu" autocomplete="username" autocapitalize="none">
<label>Contraseña</label><input id="lc" type="password" autocomplete="current-password">
<button onclick="entrar()">Ingresar</button></div>

<div id="vPrimer" class="p h"><h3>Primer acceso</h3><p>Por seguridad, elija su propio usuario y contraseña.</p>
<label>Nuevo usuario (4 a 20 caracteres)</label><input id="pu" autocapitalize="none">
<label>Nueva contraseña (mínimo 8)</label><input id="pc" type="password" autocomplete="new-password">
<label>Repetir contraseña</label><input id="pc2" type="password" autocomplete="new-password">
<button onclick="primer()">Guardar y continuar</button><button class="s" onclick="salir()">Salir</button></div>

<div id="vApp" class="h">
<div class="p"><h3>Buscar</h3><div class="g">
<div><label>Cite / ID / Asunto</label><input id="bq"></div>
<div><label>Estado</label><select id="be"></select></div></div>
<button onclick="buscar()">Buscar</button><div id="lista"></div></div>
<div class="p" id="pAlta"><h3>Nuevo registro</h3><div class="g">
<div><label>Tipo documental</label><select id="at"></select></div>
<div><label>Dependencia</label><select id="ad" onchange="unidades()"></select></div>
<div><label>Unidad</label><select id="au"></select></div>
<div><label>Número de Cite</label><input id="an" inputmode="numeric"></div>
<div><label>Destino</label><select id="ade"></select></div>
<div><label>Responsable</label><input id="ar"></div></div>
<label>Destinatario</label><input id="adt"><label>Asunto</label><input id="aa">
<label>Referencia</label><input id="arf"><button onclick="alta()">Registrar</button></div>
<div class="p h" id="pUsu"><h3>Usuarios</h3><div id="lu2"></div><h4>Nuevo usuario</h4><div class="g">
<div><label>Nombre completo</label><input id="un"></div>
<div><label>Dependencia</label><select id="ud"></select></div>
<div><label>Rol</label><select id="ur"><option>Registro</option><option>Revisor</option><option>Consulta</option><option>Administrador</option></select></div>
<div><label>Usuario temporal</label><input id="ut" autocapitalize="none"></div>
<div><label>Contraseña temporal</label><input id="uc"></div></div>
<button class="s" onclick="$('uc').value=gen()">Generar contraseña</button><button onclick="crearUsr()">Crear usuario</button></div>
<div class="p h" id="vDet"></div>
<button class="s" onclick="salir()">Cerrar sesión</button>
</div></main>
<script>
const API = "https://script.google.com/macros/s/AKfycbwktpBizP2ZVbYOx1V9v93509fzl66fi88QiiQcocuNf5RKAwZHCKNUXxlsYc0tZ-VJkw/exec";   // termina en /exec
let token = sessionStorage.getItem("tk") || "", cat = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function msg(t, ok) { const m = $("msg"); m.textContent = t; m.className = ok ? "ok" : "er"; m.style.display = t ? "block" : "none"; }
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
async function api(p) {
  p.token = token;
  const r = await fetch(API, { method: "POST", body: JSON.stringify(p) });   // text/plain: evita CORS previo
  const j = await r.json();
  if (!j.ok) { if (j.mensaje === "SESION_EXPIRADA") salir(); throw new Error(j.mensaje); }
  return j;
}
async function entrar() {
  try { msg("");
    const u = $("lu").value.trim().toLowerCase();
    const j = await api({ op: "login", usuario: u, clave: await sha(u + ":" + $("lc").value) });
    token = j.token; sessionStorage.setItem("tk", token); $("lc").value = ""; if (j.usuario.pendiente) mostrarPrimer(); else await iniciar();
  } catch (e) { msg(e.message); } }
function salir() { if (token) fetch(API, { method: "POST", body: JSON.stringify({ op: "logout", token }) }).catch(() => {});
  token = ""; sessionStorage.removeItem("tk"); $("vLogin").classList.remove("h"); $("vApp").classList.add("h"); $("vPrimer").classList.add("h"); $("quien").textContent = ""; }
const opts = (a, v, t) => a.map(x => `<option value="${esc(v ? x[v] : x)}">${esc(t ? t(x) : x)}</option>`).join("");
async function iniciar() {
  try { cat = await api({ op: "catalogos" }); } catch (e) { if (/cambiar su usuario/.test(e.message)) mostrarPrimer(); return; }
  $("vLogin").classList.add("h"); $("vApp").classList.remove("h");
  $("quien").textContent = cat.usuario.nombre + " (" + cat.usuario.rol + ")";
  $("be").innerHTML = '<option value="">Todos</option>' + opts(cat.estados);
  $("at").innerHTML = opts(cat.tipos, "Codigo", x => x.Codigo + " - " + x.Tipo);
  $("ad").innerHTML = opts(cat.dependencias, "Sigla", x => x.Sigla);
  $("ade").innerHTML = opts(cat.destinos); unidades();
  $("pAlta").classList.toggle("h", !["Administrador", "Registro"].includes(cat.usuario.rol));
  const adm = cat.usuario.rol === "Administrador"; $("pUsu").classList.toggle("h", !adm);
  if (adm) { $("ud").innerHTML = '<option value="">(sin dependencia)</option>' + opts(cat.dependencias, "Sigla", x => x.Sigla); usuarios(); }
  buscar();
}
function unidades() { $("au").innerHTML = opts(cat.unidades.filter(u => u.Dependencia === $("ad").value), "Sigla", x => x.Sigla); }
async function buscar() {
  try { const q = $("bq").value.trim(), f = { Estado: $("be").value };
    const j = await api({ op: "buscar", filtros: q ? Object.assign(f, /^REG-/i.test(q) ? { ID_Registro: q } : { Cite: q }) : f });
    $("lista").innerHTML = j.registros.map(r => `<div class="c" onclick="ver('${esc(r.ID_Registro)}')">
      <b>${esc(r.Cite)}</b><br>${esc(r.Asunto)}<br>${esc(r.Estado)} · ${esc(r.Destino)}
      <b class="sem ${r.Semaforo}"> ● ${esc(r.Semaforo)}</b></div>`).join("") || "<p>Sin resultados.</p>";
  } catch (e) { msg(e.message); } }
async function alta() {
  try { const j = await api({ op: "alta", gestion: cat.gestion, tipo: $("at").value, dependencia: $("ad").value,
      unidad: $("au").value, numeroCite: $("an").value, destino: $("ade").value, responsable: $("ar").value,
      destinatario: $("adt").value, asunto: $("aa").value, referencia: $("arf").value });
    msg("Registrado: " + j.id + " — " + j.cite, true); buscar();
  } catch (e) { msg(e.message); } }
async function ver(id) {
  try { const j = await api({ op: "obtener", id }), r = j.registro, rol = cat.usuario.rol;
    const sig = cat.transiciones[r.Estado] || [];
    $("vDet").innerHTML = `<h3>${esc(r.Cite)}</h3><p>${esc(r.ID_Registro)} · ${esc(r.Asunto)}<br>Estado: <b>${esc(r.Estado)}</b> · ${esc(r.Destino)}
      · <b class="sem ${r.Semaforo}">${esc(r.Semaforo)}</b> (${esc(r.Tiempo_Transcurrido)})<br>
      ${r.Enlace_PDF ? `<a href="${esc(r.Enlace_PDF)}" target="_blank" rel="noopener">Ver PDF</a>` : "Sin PDF"}</p>
      ${["Administrador", "Revisor"].includes(rol) && sig.length ? `<label>Nuevo estado</label><select id="ne">${opts(sig)}</select>
      <label>Observaciones</label><input id="no"><button onclick="estado('${esc(id)}')">Cambiar estado</button>` : ""}
      ${["Administrador", "Registro", "Revisor"].includes(rol) ? `<label>Cargar PDF</label><input id="pf" type="file" accept="application/pdf">
      <button onclick="pdf('${esc(id)}')">Subir PDF</button>` : ""}
      ${j.historial ? "<h4>Historial</h4>" + j.historial.map(h => `<div>${esc(h.Fecha)} ${esc(h.Hora)} · ${esc(h.Usuario)} · ${esc(h.Estado_Anterior)} → ${esc(h.Estado_Nuevo)}</div>`).join("") : ""}`;
    $("vDet").classList.remove("h"); $("vDet").scrollIntoView();
  } catch (e) { msg(e.message); } }
async function estado(id) {
  try { await api({ op: "cambiarEstado", id, estado: $("ne").value, obs: $("no").value }); msg("Estado actualizado.", true); ver(id); buscar();
  } catch (e) { msg(e.message); } }
function pdf(id) {
  const f = $("pf").files[0];
  if (!f || f.type !== "application/pdf") return msg("Seleccione un archivo PDF.");
  if (f.size > 8 * 1024 * 1024) return msg("El PDF no debe superar 8 MB.");
  const rd = new FileReader();
  rd.onload = async () => { try { await api({ op: "subirPdf", id, base64: rd.result.split(",")[1] }); msg("PDF cargado.", true); ver(id); }
    catch (e) { msg(e.message); } };
  rd.readAsDataURL(f);
}
function gen() { const a = "abcdefghjkmnpqrstuvwxyz23456789"; return Array.from(crypto.getRandomValues(new Uint8Array(10)), x => a[x % a.length]).join(""); }
function mostrarPrimer() { $("vLogin").classList.add("h"); $("vApp").classList.add("h"); $("vPrimer").classList.remove("h"); }
async function primer() {
  try { msg(""); const n = $("pu").value.trim().toLowerCase(), c = $("pc").value;
    if (!/^[a-z0-9._-]{4,20}$/.test(n)) return msg("Usuario: 4 a 20 caracteres (letras, números, punto o guion).");
    if (c.length < 8) return msg("La contraseña debe tener al menos 8 caracteres.");
    if (c !== $("pc2").value) return msg("Las contraseñas no coinciden.");
    await api({ op: "primerAcceso", nuevoUsuario: n, claveNueva: await sha(n + ":" + c) });
    $("pc").value = $("pc2").value = ""; $("vPrimer").classList.add("h"); await iniciar(); msg("Credenciales actualizadas.", true);
  } catch (e) { msg(e.message); } }
async function usuarios() {
  try { const j = await api({ op: "listarUsuarios" });
    $("lu2").innerHTML = j.usuarios.map(u => `<div class="c" style="cursor:default"><b>${esc(u.Nombre_Completo)}</b> · ${esc(u.Rol)} · ${esc(u.Nombre_Usuario)}<br>
      ${u.Activo === "SI" ? "Activo" : "Inactivo"}${u.Debe_Cambiar === "SI" ? " · pendiente de primer acceso" : ""}
      <button class="s" onclick="resetUsr('${esc(u.ID_Usuario)}')">Restablecer</button>
      <button class="s" onclick="actUsr('${esc(u.ID_Usuario)}',${u.Activo === "SI" ? "false" : "true"})">${u.Activo === "SI" ? "Desactivar" : "Activar"}</button></div>`).join("");
  } catch (e) { msg(e.message); } }
async function crearUsr() {
  try { const n = $("ut").value.trim().toLowerCase(), c = $("uc").value, nom = $("un").value.trim();
    if (!nom || !n || !c) return msg("Complete nombre, usuario y contraseña temporales.");
    await api({ op: "crearUsuario", usuario: n, clave: await sha(n + ":" + c), nombreCompleto: nom, dependencia: $("ud").value, rol: $("ur").value });
    msg("Usuario creado. Entregue: " + n + " / " + c + " (deberá cambiarlos al ingresar).", true);
    ["un", "ut", "uc"].forEach(i => $(i).value = ""); usuarios();
  } catch (e) { msg(e.message); } }
async function resetUsr(id) {
  try { const n = (prompt("Usuario temporal (4 a 20 caracteres):") || "").trim().toLowerCase(); if (!n) return;
    const c = gen(); await api({ op: "restablecerUsuario", id, usuario: n, clave: await sha(n + ":" + c) });
    msg("Restablecido. Entregue: " + n + " / " + c, true); usuarios();
  } catch (e) { msg(e.message); } }
async function actUsr(id, activo) { try { await api({ op: "estadoUsuario", id, activo }); usuarios(); } catch (e) { msg(e.message); } }
if (token) iniciar();
</script></body></html>
